
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantina Unisantos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="cabecalho">
        <div class="logo">
            <h1>Cantina <span>Unisantos</span></h1>
        </div>

        <div class="pesquisa">
            <input type="text" placeholder="O que você está procurando?">
            <button></button>
        </div>

        <div class="carrinho">
            <span>Meu carrinho</span>
        </div>
    </header>

    <main>

        <section class="banner">
            <div>
                <h2>Bateu a fome?</h2>
                <p>Peça seu lanche favorito na Cantina Unisantos!</p>
            </div>
        </section>

        <section class="categorias">
            <h2>Explore nossas categorias</h2>

            <div class="lista-categorias">
                <div class="categoria">🍟 <p>Salgados</p></div>
                <div class="categoria">🍫 <p>Doces</p></div>
                <div class="categoria">🥤 <p>Bebidas</p></div>
            </div>
        </section>

        <section class="produtos">
            <h2>Cardápio</h2>

            <div class="lista-produtos" id="lista-produtos">

            </div>
        </section>

    </main>

    <footer>
        <p>© 2026 Cantina Unisantos - Todos os direitos reservados.</p>
    </footer>

    <script type="module" src="main.js"></script>

</body>
</html>
